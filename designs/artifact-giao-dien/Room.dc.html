<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Phòng chờ</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#F2B544}a:hover{color:#FFD27A}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 932px; height: 430px; box-sizing: border-box; background: #0E3B2C; color: #F4F0E6; font-family: 'Be Vietnam Pro', system-ui, sans-serif; display: flex; gap: 20px; padding: 20px 24px">
  <div style="width: 250px; flex-shrink: 0; display: flex; flex-direction: column; gap: 12px">
    <a href="Main.dc.html" style="display: flex; align-items: center; gap: 6px; min-height: 32px; font-size: 14px; font-weight: 600; text-decoration: none">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
      Rời phòng
    </a>
    <div style="background: #145039; border: 1px solid #2C7158; border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 12px; color: #B9CDBF">Mã phòng</span>
      <div style="display: flex; align-items: center; justify-content: space-between">
        <span style="font-size: 34px; font-weight: 800; letter-spacing: 0.14em; font-variant-numeric: tabular-nums">2481</span>
        <button aria-label="Chia sẻ mã phòng" style="width: 44px; height: 44px; border-radius: 10px; border: 1px solid #3B7E64; background: transparent; color: #F4F0E6; display: flex; align-items: center; justify-content: center; cursor: pointer">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12v7a1 1 0 001 1h14a1 1 0 001-1v-7"></path><path d="M16 6l-4-4-4 4"></path><path d="M12 2v13"></path></svg>
        </button>
      </div>
    </div>
    <div style="display: flex; flex-wrap: wrap; gap: 6px">
      <span style="font-size: 12px; font-weight: 600; padding: 5px 10px; border-radius: 999px; background: #145039; border: 1px solid #2C7158">Base 5</span>
      <span style="font-size: 12px; font-weight: 600; padding: 5px 10px; border-radius: 999px; background: #145039; border: 1px solid #2C7158">Tính ăn cây thường</span>
      <span style="font-size: 12px; font-weight: 600; padding: 5px 10px; border-radius: 999px; background: #145039; border: 1px solid #2C7158">25 giây / lượt</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 13px; font-weight: 600; color: #B9CDBF">Chọn người được chia và đánh sau bạn (ván đầu)</span>
      <div style="display: flex; gap: 6px">
        <sc-for list="{{directions}}" as="d" hint-placeholder-count="2">
          <button onClick="{{d.pick}}" aria-pressed="{{d.pressed}}" style="{{d.style}}">
            <sc-if value="{{d.ccw}}" hint-placeholder-val="{{ true }}">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 109-9"></path><path d="M3 4v5h5"></path></svg>
            </sc-if>
            <sc-if value="{{d.cw}}" hint-placeholder-val="{{ false }}">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 11-9-9"></path><path d="M21 4v5h-5"></path></svg>
            </sc-if>
            {{d.label}}
          </button>
        </sc-for>
      </div>
      <span style="font-size: 12px; color: #B9CDBF">{{dirHint}}</span>
    </div>
  </div>

  <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 12px">
    <div style="flex: 1; position: relative; background: #145039; border: 1px solid #2C7158; border-radius: 22px">
      <div style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 4px; color: #B9CDBF">
        <span style="font-size: 13px; font-weight: 600">{{seatCount}}/4 người · {{readyCount}} sẵn sàng</span>
        <span style="font-size: 12px">Ván đầu: chủ phòng đi đầu</span>
      </div>
      <sc-for list="{{seats}}" as="s" hint-placeholder-count="4">
        <div style="{{s.pos}}">
          <div style="{{s.avatar}}">{{s.initials}}</div>
          <div style="display: flex; flex-direction: column; min-width: 0">
            <span style="font-size: 14px; font-weight: 700; white-space: nowrap">{{s.name}}</span>
            <span style="{{s.statusStyle}}">{{s.status}}</span>
          </div>
        </div>
      </sc-for>
    </div>
    <div style="display: flex; gap: 10px; justify-content: flex-end">
      <button onClick="{{toggleReady}}" aria-pressed="{{readyPressed}}" style="{{readyStyle}}">{{readyLabel}}</button>
      <sc-if value="{{canStart}}" hint-placeholder-val="{{ false }}">
        <a href="Table.dc.html" style="display: flex; align-items: center; justify-content: center; height: 46px; padding: 0 24px; border-radius: 12px; background: #F2B544; color: #1E1A10; font-weight: 700; text-decoration: none">Bắt đầu ván</a>
      </sc-if>
      <sc-if value="{{cannotStart}}" hint-placeholder-val="{{ true }}">
        <button disabled style="height: 46px; padding: 0 20px; border-radius: 12px; background: #1B5E45; color: #B9CDBF; border: 1px dashed #3B7E64; font-weight: 600">Cần đủ 4 người sẵn sàng</button>
      </sc-if>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"full":{"editor":"boolean","default":false,"section":"Trạng thái"},"$preview":{"width":932,"height":430}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { dir: 'ccw', ready: true };
  }
  renderVals() {
    const full = this.props.full ?? false;
    const ready = this.state.ready;
    const dirChip = (key, label) => {
      const on = this.state.dir === key;
      return {
        label, ccw: key === 'ccw', cw: key === 'cw',
        pressed: String(on),
        pick: () => this.setState({ dir: key }),
        style: 'display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 10px; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; ' +
          (on ? 'background: #F2B544; color: #1E1A10; border: 1px solid #F2B544;' : 'background: transparent; color: #F4F0E6; border: 1px solid #3B7E64;'),
      };
    };
    const base = 'position: absolute; display: flex; align-items: center; gap: 10px; ';
    const people = [
      { name: 'Bạn · chủ phòng', initials: 'B', r: ready, pos: base + 'left: 50%; bottom: 14px; transform: translateX(-50%);' },
      { name: 'Lan', initials: 'L', r: true, pos: base + 'right: 18px; top: 50%; transform: translateY(-50%);' },
      { name: 'Tuấn', initials: 'T', r: full, pos: base + 'left: 50%; top: 14px; transform: translateX(-50%);' },
      full
        ? { name: 'Hùng', initials: 'H', r: true, pos: base + 'left: 18px; top: 50%; transform: translateY(-50%);' }
        : { name: 'Ghế trống', initials: '+', empty: true, pos: base + 'left: 18px; top: 50%; transform: translateY(-50%);' },
    ];
    const seats = people.map((p) => ({
      ...p,
      status: p.empty ? 'Đang chờ người chơi…' : p.r ? 'Sẵn sàng' : 'Chưa sẵn sàng',
      statusStyle: 'font-size: 12px; font-weight: 600; color: ' + (p.empty ? '#B9CDBF' : p.r ? '#8EE3B0' : '#FFC98A') + ';',
      avatar: 'width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 17px; ' +
        (p.empty ? 'border: 2px dashed #3B7E64; color: #B9CDBF;' : 'background: #F4F0E6; color: #0E3B2C;' + (p.r ? ' box-shadow: 0 0 0 3px #8EE3B0;' : '')),
    }));
    const seated = seats.filter((s) => !s.empty);
    const readyCount = seated.filter((s) => s.r).length;
    const canStart = full && readyCount === 4;
    return {
      directions: [dirChip('ccw', 'Lan · bên phải'), dirChip('cw', (full ? 'Hùng' : 'Ghế trái') + ' · bên trái')],
      dirHint: this.state.dir === 'ccw' ? 'Ván này đánh ngược chiều kim đồng hồ' : 'Ván này đánh thuận chiều kim đồng hồ',
      seats,
      seatCount: seated.length,
      readyCount,
      canStart,
      cannotStart: !canStart,
      readyPressed: String(ready),
      readyLabel: ready ? 'Huỷ sẵn sàng' : 'Sẵn sàng',
      toggleReady: () => this.setState({ ready: !ready }),
      readyStyle: 'height: 46px; padding: 0 20px; border-radius: 12px; font-weight: 700; font-size: 15px; cursor: pointer; ' +
        (ready ? 'background: transparent; color: #F4F0E6; border: 1px solid #3B7E64;' : 'background: #8EE3B0; color: #0E3B2C; border: 1px solid #8EE3B0;'),
    };
  }
}
</script>
</body>
</html>
